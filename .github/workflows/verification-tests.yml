name: Verification tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verification-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: Edit Mode verification suites
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      # Sin Library/ cacheada Unity reimporta todo el proyecto (paquetes XR incluidos) en cada corrida.
      - uses: actions/cache@v4
        with:
          path: primerVolante/Library
          key: Library-${{ hashFiles('primerVolante/Assets/**', 'primerVolante/Packages/**', 'primerVolante/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: primerVolante
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Verification test results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
